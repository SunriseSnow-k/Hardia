# Instaladores de los dos sistemas, cada uno con los colectores de Windows y Linux.
# PyInstaller no compila para otro sistema: primero cada sistema genera su colector
# (dist/colectores/Colector-<sistema>.tar.gz) y despues cada instalador se arma con los dos.
# Se ejecuta a mano (Actions -> Paquetes -> Run workflow) o al publicar una etiqueta v* (v1.0.0).
# Los instaladores quedan como artefactos de la ejecucion.
name: Paquetes

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  colectores:
    strategy:
      matrix:
        include:
          - {so: windows-latest, sistema: windows}
          - {so: ubuntu-22.04, sistema: linux}    # la glibc mas antigua que se quiere admitir
    runs-on: ${{ matrix.so }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Bibliotecas de Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependencias (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-dev.txt
      - name: Dependencias (Linux)
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements-dev.txt
      - name: Colector (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build.ps1 -SoloColector
      - name: Colector (Linux)
        if: runner.os != 'Windows'
        run: ./build.sh --solo-colector
      - uses: actions/upload-artifact@v4
        with:
          name: colector-${{ matrix.sistema }}
          path: dist/colectores/Colector-${{ matrix.sistema }}.tar.gz

  instaladores:
    needs: colectores
    strategy:
      matrix:
        include:
          - {so: windows-latest, sistema: windows}
          - {so: ubuntu-22.04, sistema: linux}
    runs-on: ${{ matrix.so }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: colector-*
          path: dist/colectores
          merge-multiple: true
      - name: Bibliotecas de Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependencias (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements-dev.txt
          choco install innosetup -y --no-progress
      - name: Dependencias (Linux)
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements-dev.txt
      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build.ps1
      - name: Instalador (Linux)
        if: runner.os != 'Windows'
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.sistema }}
          path: |
            dist/instalador/*.exe
            dist/instalador/*.tar.gz
          if-no-files-found: error
