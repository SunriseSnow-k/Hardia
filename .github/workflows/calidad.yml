# Integracion continua: en cada push o pull request se ejecutan los mismos controles que
# calidad.ps1 en un Windows limpio. Si algo falla, el cambio no deberia integrarse a main.
name: Calidad

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Controles de calidad
        shell: pwsh
        run: .\calidad.ps1
