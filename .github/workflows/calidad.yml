# Integracion continua: en cada push o pull request se ejecutan los mismos controles que
# calidad.ps1 (Windows) y calidad.sh (Linux) en equipos limpios de los dos sistemas.
# Si algo falla, el cambio no deberia integrarse a main.
name: Calidad

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Controles de calidad
        shell: pwsh
        run: .\calidad.ps1

  linux:
    runs-on: ubuntu-22.04  # la glibc mas antigua que se quiere admitir
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Bibliotecas de Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Controles de calidad
        run: ./calidad.sh
